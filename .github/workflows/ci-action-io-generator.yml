name: action-io-generator CI
on:
  push:
    branches: [main]
    paths:
      - 'action-io-generator/**'
      - '.github/workflows/ci-action-io-generator.yml'
  pull_request:
    paths:
      - 'action-io-generator/**'
      - '.github/workflows/ci-action-io-generator.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: action-io-generator

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint

  check-dist:
    name: Check Distribution
    runs-on: ubuntu-24.04
    env:
      BUNDLE_FILE: "dist/bin.js"
      BUNDLE_COMMAND: "npm run bundle"
      WORKDIR: "./action-io-generator"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        working-directory: ${{ env.WORKDIR }}
        run: npm ci

      - name: Verify Latest Bundle
        uses: ./bundle-verifier
        with:
          bundle_file: ${{ env.BUNDLE_FILE }}
          bundle_command: ${{ env.BUNDLE_COMMAND }}
          working_directory: ${{ env.WORKDIR }}

  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm run compile
      - run: npm test